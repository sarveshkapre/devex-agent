openapi: 3.1.0
info:
  title: OneOf Discriminator
  version: 1.0.0
servers:
  - url: https://api.oneof.test
paths:
  /pet:
    post:
      tags: [Pets]
      summary: Create pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
components:
  schemas:
    Pet:
      oneOf:
        - $ref: "#/components/schemas/Cat"
        - $ref: "#/components/schemas/Dog"
      discriminator:
        propertyName: petType
        mapping:
          cat: "#/components/schemas/Cat"
          dog: "#/components/schemas/Dog"
    PetOrNull:
      oneOf:
        - type: "null"
        - $ref: "#/components/schemas/Cat"
    Cat:
      type: object
      required: [petType, huntingSkill]
      properties:
        petType:
          type: string
          enum: [cat]
        huntingSkill:
          type: string
    Dog:
      type: object
      required: [petType, packSize]
      properties:
        petType:
          type: string
          enum: [dog]
        packSize:
          type: integer
