openapi: 3.0.0
info:
  title: Unresolved Ref API
  version: "1.0"
paths:
  /pets:
    post:
      summary: Create a pet (broken ref)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissingPet"
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
components:
  schemas:
    Present:
      type: object
      properties:
        id:
          type: string
